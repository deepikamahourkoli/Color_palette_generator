<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="/server">
      <input type="checkbox" id="age" name="age" value="18+" />
      <label for="age">I am 18+</label>
      <div>
        <input type="radio" name="fruit" id="apple" value="apple" />
        <label for="apple">apple</label>
        <input type="radio" name="fruit" id="mango" value="mango" />
        <label for="mango">mango</label>
      </div>
      <button>submit</button>
      Select your State
      <select name="state" id="state">
        <option>Select your option</option>
        <option value="Delhi" selected>Delhi</option>
        <option value="Maharashtra">Maharashtra</option>
        <option value="Arunachal Pradesh">Arunachal Pradesh</option>
        <option value="Madhya Pradesh">Madhya Pradesh</option>
        <option value="Chhatisgarh">Chhatisgarh</option>
      </select>
      select your volume
      <input type="range" min="1" max="100" name="vol" id="vol" />
      <br />
      please give your valuable feedback
      <textarea name="feedback" id="feedback"></textarea>
    </form>
  </body>
</html>
