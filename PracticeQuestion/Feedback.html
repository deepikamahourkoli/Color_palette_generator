<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <form action="/server">
      <h3><b>Feedback Form</b></h3>
      <br />
      <div>
        <label for="name" style="color: brown">Name:</label>
        <input
          type="text"
          name="name"
          id="name"
          placeholder="Write your name"
        /><br />
      </div>
      <div>
        <label for="email" style="color: blueviolet">Email:</label>
        <input
          type="text"
          name="email"
          id="email"
          placeholder="Write your email"
        /><br />
      </div>
      <div>
        <label for="message">Message:</label><br />
        <textarea name="message" id="message" rows="5" cols="35"></textarea>
      </div>
      <div>
        <label for="Rate us our of 5:" style="color: rgb(4, 138, 248)"
          >Rate us our of 5:</label
        >
        <br />
        <input type="radio" name="rate" />
        <label for="1" name="rate">1</label><br />
        <input type="radio" name="rate" />
        <label for="1" name="rate">2</label><br />
        <input type="radio" name="rate" />
        <label for="1" name="rate">3</label><br />
        <input type="radio" name="rate" />
        <label for="1" name="rate">4</label><br />
        <input type="radio" name="rate" />
        <label for="1" name="rate">5</label><br />
      </div>
      <div>
        <button style="background-color: aqua">Send your message!</button>
      </div>
    </form>
  </body>
</html>
