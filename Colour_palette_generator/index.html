<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colour Palette Generator</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Color Palette Generator</h1>
      <button id="generate-btn">
        <i class="fas fa-sync-alt"></i>
        Generate Palette
      </button>
      <div class="palette-container">
        <!-- color b1 -->
        <div class="color-box">
          <div class="color" style="background-color: #ffff3f"></div>
          <div class="color-info">
            <span class="hex-value">#ffff3f</span>
            <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
          </div>
        </div>
        <!-- color b2 -->
        <div class="color-box">
          <div class="color" style="background-color: #b5b5b5"></div>
          <div class="color-info">
            <span class="hex-value">#b5b5b5</span>
            <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
          </div>
        </div>
        <!-- color b3 -->
        <div class="color-box">
          <div class="color" style="background-color: #921818"></div>
          <div class="color-info">
            <span class="hex-value">#921818</span>
            <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
          </div>
        </div>
        <!-- color b4 -->
        <div class="color-box">
          <div class="color" style="background-color: #118d26"></div>
          <div class="color-info">
            <span class="hex-value">#118d26</span>
            <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
          </div>
        </div>
        <!-- color b5 -->
        <div class="color-box">
          <div class="color" style="background-color: #3fb9ff"></div>
          <div class="color-info">
            <span class="hex-value">#3fb9ff</span>
            <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
